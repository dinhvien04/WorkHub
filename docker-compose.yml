# WorkHub local stack: app dependencies (Mongo, Redis, ClamAV)
# Usage:
#   docker compose up -d
#   set MONGODB_URI / REDIS_URL / CLAMAV_HOST in .env

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - workhub_mongo:/data/db
    command: ['--replSet', 'rs0', '--bind_ip_all']
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }" | mongosh --quiet
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - workhub_redis:/data

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    ports:
      - '127.0.0.1:3310:3310'
    volumes:
      - workhub_clamav:/var/lib/clamav

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: workhub-rabbitmq
    restart: unless-stopped
    ports:
      - '127.0.0.1:5672:5672'     # AMQP Protocol Port
      - '127.0.0.1:15672:15672'   # Web Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - workhub_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  communication-service:
    build:
      context: .
      dockerfile: services/communication-service/Dockerfile
    container_name: workhub-communication-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGODB_COMMUNICATION_URI=mongodb://mongo:27017/workhub_communication
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET:?required}
      - COMMUNICATION_INTERNAL_SECRET=${COMMUNICATION_INTERNAL_SECRET:?required}
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  content-service:
    build:
      context: .
      dockerfile: services/content-service/Dockerfile
    container_name: workhub-content-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGODB_CONTENT_URI=mongodb://mongo:27017/workhub_content
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET:?required}
      - CONTENT_INTERNAL_SECRET=${CONTENT_INTERNAL_SECRET:?required}
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  legacy-monolith:
    build:
      context: .
      dockerfile: apps/legacy-monolith/Dockerfile
    container_name: workhub-legacy-monolith
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://mongo:27017/workhub
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET:?required}
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: workhub-api-gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LEGACY_MONOLITH_URL=http://legacy-monolith:3001
      - COMMUNICATION_SERVICE_URL=http://communication-service:3002
      - COMMUNICATION_SERVICE_ENABLED=true
      - COMMUNICATION_CANARY_PERCENT=100
      - COMMUNICATION_INTERNAL_SECRET=${COMMUNICATION_INTERNAL_SECRET:?required}
      - CONTENT_SERVICE_URL=http://content-service:3003
      - CONTENT_SERVICE_ENABLED=true
      - CONTENT_CANARY_PERCENT=100
      - CONTENT_INTERNAL_SECRET=${CONTENT_INTERNAL_SECRET:?required}
      - JWT_SECRET=${JWT_SECRET:?required}
    depends_on:
      - legacy-monolith
      - communication-service
      - content-service

volumes:
  workhub_mongo:
  workhub_redis:
  workhub_clamav:
  workhub_rabbitmq:
